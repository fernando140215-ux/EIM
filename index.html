<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Errores Innatos del Metabolismo - Diagnóstico</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; background: linear-gradient(to right, #e0f7fa, #f3e5f5); }
  .logo-img { max-height: 80px; }
  .btn { @apply px-4 py-2 rounded font-semibold text-white transition; }
  .btn-primary { @apply bg-blue-500 hover:bg-blue-600; }
  .btn-secondary { @apply bg-gray-500 hover:bg-gray-600; }
  .modal { @apply fixed inset-0 flex items-center justify-center bg-black bg-opacity-50; }
  .modal-content { @apply bg-white p-6 rounded-lg shadow-lg max-w-lg w-full; }
</style>
</head>
<body>
  <header class="flex items-center justify-between p-4 shadow bg-white border-b border-gray-200">
    <img src="logo.png" alt="MSP Logo" class="logo-img">
    <div class="text-center">
      <h1 class="text-lg font-bold">Hospital Pediátrico Baca Ortiz</h1>
      <p>Ministerio de Salud Pública</p>
      <p>Asistente Diagnóstico Metabólico Pediátrico</p>
    </div>
  </header>

  <main class="p-4" id="app">
    <!-- Contenido dinámico renderizado por JS -->
  </main>

  <footer class="text-center p-4 text-sm text-gray-600">
    Versión 1.0 - Fernando Cruz
  </footer>

<script>
const state = {
  step: 'input',
  patientData: {},
  labs: {},
  symptoms: [],
  results: [],
  references: [
    {title: "Artículo A", relevance: "Hipoglucemia y crisis metabólica", doi: "10.1000/xyz123"},
    {title: "Artículo B", relevance: "Acidosis metabólica en niños", doi: "10.1000/xyz124"},
    {title: "Artículo C", relevance: "Hiperamonemia y EM", doi: "10.1000/xyz125"},
    {title: "Artículo D", relevance: "Errores innatos de metabolismo pediátricos", doi: "10.1000/xyz126"},
    {title: "Artículo E", relevance: "Cetonas y pH sanguíneo", doi: "10.1000/xyz127"},
    {title: "Artículo F", relevance: "Interpretación bioquímica rápida", doi: "10.1000/xyz128"}
  ]
};

function calcAG(sodium, chloride, bicarbonate) {
  return sodium - (chloride + bicarbonate);
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  if (state.step === 'input') renderInput(app);
  if (state.step === 'result') renderResult(app);
}

function renderInput(container) {
  const div = document.createElement('div');
  div.innerHTML = `
    <h2 class="text-xl font-bold mb-4">Ingreso de datos clínicos y laboratoriales</h2>
    <p class="mb-2 text-red-600 font-semibold">Esta herramienta es educativa y no sustituye la valoración médica.</p>

    <div class="mb-4">
      <label>Edad:</label>
      <input type="number" id="edad" class="border p-2 rounded w-24" placeholder="0">
      <select id="edadUnidad" class="border p-2 rounded">
        <option value="dias">Días</option>
        <option value="meses">Meses</option>
        <option value="años">Años</option>
      </select>
    </div>

    <div class="mb-4">
      <label>Presentación clínica:</label>
      <select id="presentation" class="border p-2 rounded w-full">
        <option value="aguda">Aguda</option>
        <option value="cronica">Crónica</option>
      </select>
    </div>

    <div class="mb-4">
      <label>Síntomas:</label>
      <div class="flex flex-wrap gap-2 mt-2">
        ${['Letargia','Vomitos','Convulsiones','Hepatomegalia','Olor anormal','Crisis ayuno'].map(sym => 
          `<button type="button" class="btn btn-secondary symptom-btn" data-sym="${sym}">${sym}</button>`
        ).join('')}
      </div>
    </div>

    <h3 class="font-bold mt-4 mb-2">Laboratorios</h3>
    <div class="grid grid-cols-2 gap-4">
      ${['Glucosa','Lactato','Amonio','pH','Bicarbonato','Sodio','Cloro','TGP','CPK','Cetonas'].map(lab => 
        `<div>
          <label>${lab}:</label>
          <input type="number" step="any" class="border p-2 rounded w-full lab-input" data-lab="${lab}">
        </div>`
      ).join('')}
    </div>

    <button id="analyzeBtn" class="btn btn-primary mt-4">Analizar</button>
  `;
  container.appendChild(div);

  // Eventos botones síntomas
  document.querySelectorAll('.symptom-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      const sym = e.target.dataset.sym;
      if (state.symptoms.includes(sym)) state.symptoms = state.symptoms.filter(s => s !== sym);
      else state.symptoms.push(sym);
      e.target.classList.toggle('bg-blue-500');
    });
  });

  document.getElementById('analyzeBtn').addEventListener('click', () => {
    state.patientData.edad = document.getElementById('edad').value;
    state.patientData.edadUnidad = document.getElementById('edadUnidad').value;
    state.patientData.presentation = document.getElementById('presentation').value;

    document.querySelectorAll('.lab-input').forEach(input => {
      state.labs[input.dataset.lab] = parseFloat(input.value);
    });

    analyze();
    state.step = 'result';
    render();
  });
}

function analyze() {
  const res = [];
  const labs = state.labs;
  const symptoms = state.symptoms;

  if(labs.Glucosa < 60) res.push({diagnosis:"Hipoglucemia", severity:"EMERGENCIA", note:"Riesgo inmediato de crisis"}); 
  if(symptoms.includes('Crisis ayuno')) res.push({diagnosis:"Crisis por ayuno", severity:"ALTA", note:"Sugiere déficit energético"}); 
  if(labs.pH && labs.Bicarbonato) {
    const ag = calcAG(labs.Sodio||0,labs.Cloro||0,labs.Bicarbonato||0);
    if(ag > 16) res.push({diagnosis:"Acidosis metabólica con Anion Gap elevado", severity:"URGENCIA", note:"Considerar errores innatos de metabolismo"});
  }
  if(labs.Amonio > 80) res.push({diagnosis:"Hiperamonemia", severity:"EMERGENCIA", note:"Evaluar metabolismo de aminoácidos"});
  state.results = res;
}

function renderResult(container) {
  const div = document.createElement('div');
  div.innerHTML = `
    <h2 class="text-xl font-bold mb-4">Resultados del análisis</h2>
    <div class="mb-4">
      ${state.results.map(r => 
        `<div class="border-l-4 p-2 mb-2 ${r.severity==='EMERGENCIA'?'border-red-600':'border-yellow-500'}">
          <strong>${r.diagnosis}</strong> - <em>${r.severity}</em><br>${r.note}
        </div>`
      ).join('')}
    </div>
    <button id="newBtn" class="btn btn-primary">Nueva Evaluación</button>
    <button id="refsBtn" class="btn btn-secondary ml-2">Referencias</button>
  `;
  container.appendChild(div);

  document.getElementById('newBtn').addEventListener('click', () => {
    state.step = 'input';
    state.patientData = {};
    state.labs = {};
    state.symptoms = [];
    state.results = [];
    render();
  });

  document.getElementById('refsBtn').addEventListener('click', () => renderRefsModal());
}

function renderRefsModal() {
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `
    <div class="modal-content">
      <h3 class="font-bold mb-2">Referencias</h3>
      <ul class="list-disc pl-5">
        ${state.references.map(r => `<li><strong>${r.title}</strong>: ${r.relevance} - DOI: ${r.doi}</li>`).join('')}
      </ul>
      <button id="closeRefs" class="btn btn-primary mt-4">Cerrar</button>
    </div>
  `;
  document.body.appendChild(modal);

  document.getElementById('closeRefs').addEventListener('click', () => modal.remove());
}

render();
</script>
</body>
</html>
